<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI LEX 2026 — Pre-event questionnaire for Cathay Capital B2B SaaS portfolio leadership teams.">
<title>AI LEX 2026 — Pre-Event Questionnaire</title>
<style>
  :root {
    --navy: #1A1E2C;
    --navy-2: #252B3D;
    --navy-3: #303852;
    --amber: #FFB20A;
    --amber-dark: #E89C00;
    --amber-soft: rgba(255, 178, 10, 0.12);
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --input: #F7F8FA;
    --border: #E3E6EB;
    --border-strong: #C9CED6;
    --text: #1A1E2C;
    --muted: #5C6573;
    --dim: #9AA1AC;
    --core: #2563EB;
    --core-soft: rgba(37, 99, 235, 0.1);
    --error: #D64545;
    --success: #1E9E5A;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(26,30,44,0.06), 0 6px 20px rgba(26,30,44,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--amber-dark); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 50;
  }
  .header-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 26px; display: block; }
  .brand .brand-divider { width: 1px; height: 22px; background: var(--border-strong); }
  .brand .brand-event {
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700; color: var(--navy);
    background: var(--amber-soft); border: 1px solid rgba(255,178,10,0.45);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .save-indicator { font-size: 12px; color: var(--dim); }
  .save-indicator.saved { color: var(--success); }
  .progress-wrap { max-width: 1080px; margin: 0 auto; }
  .progress-bar {
    height: 3px; background: var(--border); border-radius: 2px 2px 0 0;
    overflow: hidden; margin-top: 12px;
  }
  .progress-fill {
    height: 100%; background: var(--amber);
    width: 0%; transition: width 0.3s ease;
  }

  /* Container */
  .container { max-width: 800px; margin: 0 auto; padding: 32px 24px 120px; }

  /* Intro hero */
  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
    border-radius: 16px;
    padding: 44px 44px 40px;
    color: #fff;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -120px; top: -120px;
    width: 340px; height: 340px; border-radius: 50%;
    border: 44px solid rgba(255,178,10,0.14);
  }
  .hero img.hero-logo { height: 30px; margin-bottom: 28px; display: block; }
  .hero h1 { font-size: 34px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 10px; }
  .hero h1 .accent { color: var(--amber); }
  .hero .subtitle { color: rgba(255,255,255,0.75); font-size: 16px; margin-bottom: 22px; }
  .hero .lede { color: rgba(255,255,255,0.92); font-size: 15px; margin-bottom: 14px; max-width: 620px; position: relative; z-index: 1; }
  .hero .deadline-pill {
    display: inline-block; margin-top: 8px;
    background: var(--amber); color: var(--navy);
    font-weight: 700; font-size: 14px;
    padding: 8px 16px; border-radius: 999px;
  }
  .intro .meta {
    display: grid; grid-template-columns: 1fr; gap: 10px;
    background: var(--card); padding: 22px 26px; border-radius: var(--radius);
    border: 1px solid var(--border); margin-top: 18px; font-size: 14px;
    box-shadow: var(--shadow);
  }
  .intro .meta div { color: var(--muted); }
  .intro .meta div strong { color: var(--navy); margin-right: 6px; }
  .intro .meta .meta-title {
    color: var(--navy); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; font-weight: 700;
    border-bottom: 2px solid var(--amber); padding-bottom: 8px; margin-bottom: 4px;
  }
  .intro .meta .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--amber); color: var(--navy);
    font-weight: 700; font-size: 12px; margin-right: 10px; flex-shrink: 0;
  }
  .intro .meta .use-line { display: flex; align-items: flex-start; }
  .speakers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .speaker {
    background: var(--input); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .speaker .sp-tag { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--amber-dark); }
  .speaker .sp-name { font-weight: 700; color: var(--navy); font-size: 13.5px; margin-top: 2px; }
  .speaker .sp-role { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .intro .legend { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .intro .legend .badge { margin-right: 6px; }
  .start-button { margin-top: 24px; }

  /* Section card */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 30px 26px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .section-step {
    color: var(--amber-dark); font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; font-weight: 700;
  }
  .section-title { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; color: var(--navy); }
  .section-desc { color: var(--muted); font-size: 14px; margin: 8px 0 22px; max-width: 580px; }

  /* Question */
  .question { margin-bottom: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .question:first-of-type { padding-top: 4px; border-top: 0; }
  .question label.q-label, .question .q-label {
    display: block; font-size: 14.5px; font-weight: 600;
    color: var(--navy); margin-bottom: 6px;
  }
  .q-subhead {
    margin-top: 28px; padding: 16px 0 0;
    border-top: 2px solid var(--amber);
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--navy); font-weight: 700;
  }
  .q-label .badge {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 4px;
    margin-left: 6px; vertical-align: middle; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .badge.required { background: rgba(214,69,69,0.1); color: var(--error); }
  .badge.core { background: var(--core-soft); color: var(--core); border: 1px solid rgba(37,99,235,0.25); }
  .badge.optional { background: rgba(154,161,172,0.14); color: var(--muted); }
  .q-help { font-size: 13px; color: var(--muted); margin-bottom: 10px; max-width: 580px; }

  input[type="text"], input[type="email"], input[type="number"], select, textarea {
    width: 100%;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: 0; border-color: var(--amber);
    background: #fff; box-shadow: 0 0 0 3px var(--amber-soft);
  }
  textarea { resize: vertical; min-height: 80px; }
  select { cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%235C6573" d="M6 8L0 0h12z"/></svg>'); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }

  .input-with-suffix { position: relative; }
  .input-with-suffix .suffix {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 13px; pointer-events: none;
  }
  .input-with-suffix input { padding-right: 36px; }

  /* Choice groups */
  .choice-group { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--input); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 8px; cursor: pointer;
    transition: all 0.15s; font-size: 14px;
  }
  .choice:hover { border-color: var(--border-strong); background: #fff; }
  .choice input { margin-top: 3px; accent-color: var(--amber-dark); cursor: pointer; flex-shrink: 0; }
  .choice.selected { border-color: var(--amber); background: var(--amber-soft); }
  .choice .choice-text { flex: 1; }

  /* Company picker */
  .company-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .company-grid .choice { align-items: center; padding: 12px 14px; }
  .company-logo-box {
    width: 34px; height: 34px; border-radius: 8px;
    background: #fff; border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }
  .company-logo-box img { width: 22px; height: 22px; object-fit: contain; display: block; }
  .logo-fallback {
    font-weight: 800; font-size: 15px; color: var(--navy);
    background: var(--amber-soft); width: 100%; height: 100%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .company-name { font-weight: 600; color: var(--navy); }

  /* Likert */
  .likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .likert label {
    display: flex; flex-direction: column; align-items: center;
    background: var(--input); border: 1px solid var(--border);
    padding: 10px 4px; border-radius: 8px; cursor: pointer;
    transition: all 0.15s; font-size: 12px; text-align: center;
    color: var(--muted);
  }
  .likert label:hover { border-color: var(--border-strong); background: #fff; }
  .likert label .num { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .likert label.selected { border-color: var(--amber); background: var(--amber-soft); color: var(--navy); }
  .likert label.selected .num { color: var(--amber-dark); }
  .likert input { display: none; }
  .likert-hint { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 4px; padding: 0 2px; }

  /* Weak/Developing/Strong */
  .wds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .wds label {
    display: flex; flex-direction: column;
    background: var(--input); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    transition: all 0.15s; font-size: 13px;
  }
  .wds label:hover { border-color: var(--border-strong); background: #fff; }
  .wds label .wds-title { font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .wds label .wds-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .wds label.selected { border-color: var(--amber); background: var(--amber-soft); }
  .wds label.selected .wds-title { color: var(--amber-dark); }
  .wds input { display: none; }

  /* Buttons */
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 24px; font-size: 14px; font-weight: 700;
    border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s; gap: 6px;
  }
  .btn-primary { background: var(--amber); color: var(--navy); box-shadow: 0 2px 8px rgba(255,178,10,0.35); }
  .btn-primary:hover { background: var(--amber-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border-strong); }
  .btn-ghost:hover { color: var(--navy); border-color: var(--navy); background: #fff; }
  .btn-link { background: transparent; color: rgba(255,255,255,0.7); padding: 6px 0; font-weight: 500; }
  .btn-link:hover { color: #fff; }

  /* Sidebar nav */
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 36px; max-width: 1080px; margin: 0 auto; padding: 32px 24px 120px; }
  .sidebar { position: sticky; top: 90px; align-self: flex-start; }
  .sidebar-title { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); font-weight: 700; margin-bottom: 12px; }
  .sidebar-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-list li {
    padding: 8px 12px; font-size: 13px; color: var(--muted);
    border-radius: 8px; cursor: pointer; transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .sidebar-list li:hover { color: var(--navy); background: var(--card); }
  .sidebar-list li.current { color: var(--navy); font-weight: 700; border-left-color: var(--amber); background: var(--card); box-shadow: var(--shadow); }
  .sidebar-list li.done { color: var(--dim); }
  .sidebar-list li.done::before { content: "✓ "; color: var(--success); }

  /* Confirmation */
  .confirmation { text-align: center; padding: 60px 20px; }
  .confirmation .checkmark {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--success); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; margin-bottom: 24px;
  }
  .confirmation h2 { font-size: 28px; font-weight: 700; margin-bottom: 12px; color: var(--navy); }
  .confirmation p { color: var(--muted); max-width: 460px; margin: 0 auto 12px; }

  .error-msg { color: var(--error); font-size: 13px; margin-top: 6px; }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; gap: 24px; padding: 24px 16px 80px; }
    .sidebar { position: static; }
    .sidebar-list { display: flex; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .sidebar-list li { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
    .sidebar-list li.current { border-left: 0; border-bottom-color: var(--amber); box-shadow: none; }
    .container { padding: 16px 16px 80px; }
    .section { padding: 22px 20px 18px; }
    .hero { padding: 30px 24px 28px; }
    .hero h1 { font-size: 26px; }
    .speakers { grid-template-columns: 1fr; }
    .company-grid { grid-template-columns: 1fr; }
    .likert { gap: 4px; }
    .likert label { padding: 8px 2px; font-size: 11px; }
    .wds { grid-template-columns: 1fr; }
    .brand .brand-event { display: none; }
  }
</style>
</head>

/* Company → website domain, for logo display in pickers */
const COMPANY_DOMAINS = {
  "DiliTrust": "dilitrust.com",
  "EasyVista": "easyvista.com",
  "Equadis": "equadis.com",
  "Onventis": "onventis.com",
  "Powell": "powell-software.com",
  "Sunstice": "sunstice.com",
  "Wedia": "wedia-group.com"
};
function companyLogoHTML(name) {
  const domain = COMPANY_DOMAINS[name];
  const initial = name ? name[0].toUpperCase() : "?";
  if (!domain) return `<span class="company-logo-box"><span class="logo-fallback">${initial}</span></span>`;
  return `<span class="company-logo-box" data-initial="${initial}">
    <img class="company-logo" src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="" loading="lazy">
  </span>`;
}

/* ============================================================
 * STATE
 * ============================================================ */
const STORAGE_KEY = "ai_lex_2026_responses_v2";
const state = {
  step: 0,
  answers: {},
  visibleSections: [],
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    Object.assign(state, parsed);
    state.step = state.step || 0;
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) {}
  flashSaveIndicator();
}
function clearState() { localStorage.removeItem(STORAGE_KEY); }

let saveTimer;
function flashSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  if (!el) return;
  el.textContent = "Saved";
  el.classList.add('saved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    el.textContent = "Auto-saved locally";
    el.classList.remove('saved');
  }, 1200);
}

/* ============================================================
 * COMMUNITY FILTERING
 * ============================================================ */
function sectionVisibleForRole(section, community) {
  if (!section.roles || section.roles.includes(ANY)) return true;
  if (!community) return true;
  return section.roles.includes(community);
}
function questionVisibleForRole(question, sectionRoles, community) {
  const roles = question.roles || sectionRoles;
  if (!roles || roles.includes(ANY)) return true;
  if (!community) return true;
  return roles.includes(community);
}
function computeVisibleSections() {
  const community = communityOf(state.answers.role);
  return SCHEMA.filter(s => sectionVisibleForRole(s, community));
}

/* ============================================================
 * RENDERING
 * ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);

function render() {
  state.visibleSections = computeVisibleSections();
  const main = document.getElementById('main');
  if (state.step === 0) {
    main.innerHTML = renderIntro();
    bindIntro();
  } else if (state.step > state.visibleSections.length) {
    main.innerHTML = renderConfirmation();
  } else {
    main.innerHTML = renderForm();
    bindForm();
  }
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderForm() {
  const sections = state.visibleSections;
  const idx = state.step - 1;
  const section = sections[idx];
  const community = communityOf(state.answers.role);

  const sidebar = `

      <div class="sidebar-title">Sections</div>
      <ul class="sidebar-list">

        `).join('')}
      </ul>
    </aside>
  `;

  const visibleQuestions = (section.questions || []).filter(q => questionVisibleForRole(q, section.roles, community));
  const isLast = idx === sections.length - 1;

  const sectionHtml = `
    <section class="section" data-section="${section.id}">
      <div class="section-step">Section ${idx+1} of ${sections.length}</div>
      <div class="section-title">${section.title}</div>

      ${visibleQuestions.map(q => renderQuestion(q)).join('')}

        <button class="btn btn-ghost" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn btn-primary" id="nextBtn">${isLast ? 'Submit answers →' : 'Next →'}</button>

      <div class="error-msg" id="errorMsg"></div>
    </section>
  `;

  return `
    <div class="layout">
      ${sidebar}
      <div class="container" style="padding-top: 0;">${sectionHtml}</div>
    </div>
  `;
}

function renderQuestion(q) {
  if (q.type === 'subhead') {
    return `<div class="q-subhead">${escapeHTML(q.label)}</div>`;
  }
  const value = state.answers[q.id];
  const requiredBadge = q.required ? `<span class="badge required">REQUIRED</span>` : '';
  const coreBadge = q.core ? `<span class="badge core">★ CORE KPI</span>` : '';
  const optBadge = q.optional ? `<span class="badge optional">OPTIONAL</span>` : '';
  const help = q.help ? `<div class="q-help">${q.help}</div>` : '';

  let body = '';
  if (q.type === 'composite') {
    body = (q.children || []).map(c => renderQuestion(Object.assign({}, c))).join('');
  } else if (q.type === 'text' || q.type === 'email') {
    body = `<input type="${q.type}" id="q_${q.id}" value="${escapeAttr(value || '')}" placeholder="${escapeAttr(q.placeholder || '')}">`;
  } else if (q.type === 'number') {
    if (q.suffix) {
      body = `<div class="input-with-suffix">
        <input type="number" id="q_${q.id}" value="${escapeAttr(value || '')}" placeholder="${escapeAttr(q.placeholder || '')}" step="any">
        <span class="suffix">${escapeHTML(q.suffix)}</span>
      </div>`;
    } else {
      body = `<input type="number" id="q_${q.id}" value="${escapeAttr(value || '')}" placeholder="${escapeAttr(q.placeholder || '')}" step="any">`;
    }
  } else if (q.type === 'textarea') {
    body = `<textarea id="q_${q.id}" placeholder="${escapeAttr(q.placeholder || '')}">${escapeHTML(value || '')}</textarea>`;
  } else if (q.type === 'select') {
    const opts = q.options || [];
    body = `<select id="q_${q.id}">
      <option value="">— choose —</option>
      ${opts.map(o => {
        const v = (typeof o === 'object') ? o.value : o;
        const l = (typeof o === 'object') ? o.label : o;
        return `<option value="${escapeAttr(v)}" ${value === v ? 'selected' : ''}>${escapeHTML(l)}</option>`;
      }).join('')}
    </select>`;
  } else if (q.type === 'company_picker' || q.type === 'company_multi') {
    const opts = q.options || [];
    const multi = q.type === 'company_multi';
    const arr = Array.isArray(value) ? value : [];
    body = `<div class="company-grid">
      ${opts.map(o => {
        const sel = multi ? arr.includes(o) : value === o;
        const logo = (o === "No preference") ? `<span class="company-logo-box"><span class="logo-fallback">∗</span></span>` : companyLogoHTML(o);
        return `<label class="choice ${sel ? 'selected' : ''}">
          <input type="${multi ? 'checkbox' : 'radio'}" name="q_${q.id}" value="${escapeAttr(o)}" ${sel ? 'checked' : ''} style="display:none;">
          ${logo}
          <span class="company-name">${escapeHTML(o)}</span>
        </label>`;
      }).join('')}
    </div>`;
  } else if (q.type === 'radio') {
    const opts = q.options || [];
    body = `<div class="choice-group">
      ${opts.map(o => {
        const v = (typeof o === 'object') ? o.value : o;
        const l = (typeof o === 'object') ? o.label : o;
        const sel = value === v;
        return `<label class="choice ${sel ? 'selected' : ''}">
          <input type="radio" name="q_${q.id}" value="${escapeAttr(v)}" ${sel ? 'checked' : ''}>
          <span class="choice-text">${escapeHTML(l)}</span>
        </label>`;
      }).join('')}
    </div>`;
  } else if (q.type === 'checkbox') {
    const opts = q.options || [];
    const arr = Array.isArray(value) ? value : [];
    body = `<div class="choice-group">
      ${opts.map(o => {
        const v = (typeof o === 'object') ? o.value : o;
        const l = (typeof o === 'object') ? o.label : o;
        const sel = arr.includes(v);
        return `<label class="choice ${sel ? 'selected' : ''}">
          <input type="checkbox" name="q_${q.id}" value="${escapeAttr(v)}" ${sel ? 'checked' : ''}>
          <span class="choice-text">${escapeHTML(l)}</span>
        </label>`;
      }).join('')}
    </div>`;
  } else if (q.type === 'likert5') {
    const labels = ["Not started","Initial","Developing","Established","Industrialised"];
    body = `<div class="likert">
      ${[1,2,3,4,5].map(n => {
        const sel = String(value) === String(n);
        return `<label class="${sel ? 'selected' : ''}">
          <input type="radio" name="q_${q.id}" value="${n}" ${sel ? 'checked' : ''}>
          <span class="num">${n}</span>
          <span>${labels[n-1]}</span>
        </label>`;
      }).join('')}
    </div>
    <div class="likert-hint"><span>1 = not started</span><span>5 = industrialised</span></div>`;
  } else if (q.type === 'weak_developing_strong') {
    const opts = [
      { v: 'weak', t: 'Weak', d: "No data, qualitative claim only" },
      { v: 'developing', t: 'Developing', d: "Some data, partial coverage" },
      { v: 'strong', t: 'Strong', d: "Quantitative, attributable, dept-level" }
    ];
    body = `<div class="wds">
      ${opts.map(o => {
        const sel = value === o.v;
        return `<label class="${sel ? 'selected' : ''}">
          <input type="radio" name="q_${q.id}" value="${o.v}" ${sel ? 'checked' : ''}>
          <span class="wds-title">${o.t}</span>
          <span class="wds-desc">${o.d}</span>
        </label>`;
      }).join('')}
    </div>`;
  }

  if (q.type === 'composite') {
    return `<div class="question">
      <div class="q-label">${escapeHTML(q.label)} ${requiredBadge}${coreBadge}${optBadge}</div>
      ${help}
      ${body}
    </div>`;
  }

  if (q.label) {
    return `<div class="question">
      <label class="q-label" for="q_${q.id}">${escapeHTML(q.label)} ${requiredBadge}${coreBadge}${optBadge}</label>
      ${help}
      ${body}
    </div>`;
  } else {
    return `<div class="question" style="padding-top: 0; border-top: 0; margin-top: -10px;">${body}</div>`;
  }
}

function bindForm() {
  const main = document.getElementById('main');
  main.addEventListener('input', e => onInputChange(e), true);
  main.addEventListener('change', e => onInputChange(e), true);
  // Logo fallback: replace broken favicon images with the company initial
  main.addEventListener('error', e => {
    const img = e.target;
    if (img && img.classList && img.classList.contains('company-logo')) {
      const box = img.closest('.company-logo-box');
      if (box) box.innerHTML = `<span class="logo-fallback">${box.getAttribute('data-initial') || '?'}</span>`;
    }
  }, true);

  $('#prevBtn').addEventListener('click', () => {
    if (state.step > 1) {
      state.step--;
      saveState();
      render();
    }
  });
  $('#nextBtn').addEventListener('click', onNext);

  document.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => {
      const target = parseInt(el.getAttribute('data-jump'), 10);
      if (target <= state.step || canSkipForward(target)) {
        state.step = target;
        saveState();
        render();
      }
    });
  });
}

function canSkipForward(target) {
  return false;
}

function onInputChange(e) {
  const t = e.target;
  const id = (t.id || t.name || '').replace(/^q_/, '');
  if (!id) return;
  const idx = state.step - 1;
  const section = state.visibleSections[idx];
  if (!section) return;

  if (t.type === 'checkbox') {
    const arr = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
    if (t.checked && !arr.includes(t.value)) arr.push(t.value);
    if (!t.checked) {
      const i = arr.indexOf(t.value);
      if (i >= 0) arr.splice(i, 1);
    }
    state.answers[id] = arr;
    const label = t.closest('.choice');
    if (label) label.classList.toggle('selected', t.checked);
  } else if (t.type === 'radio') {
    state.answers[id] = t.value;
    document.querySelectorAll(`input[name="${t.name}"]`).forEach(ip => {
      const lab = ip.closest('label');
      if (lab) lab.classList.toggle('selected', ip.checked);
    });
  } else {
    state.answers[id] = t.value;
  }
  saveState();
  if (id === 'role') {
    state.visibleSections = computeVisibleSections();
    updateProgress();
  }
}

function onNext() {
  const idx = state.step - 1;
  const section = state.visibleSections[idx];
  const errors = validateSection(section);
  if (errors.length > 0) {
    $('#errorMsg').textContent = errors[0];
    return;
  }
  $('#errorMsg').textContent = '';
  if (idx === state.visibleSections.length - 1) {
    submit();
    return;
  }
  state.step++;
  saveState();
  render();
}

function validateSection(section) {
  const community = communityOf(state.answers.role);
  const errors = [];
  for (const q of (section.questions || [])) {
    if (q.type === 'subhead') continue;
    if (!questionVisibleForRole(q, section.roles, community)) continue;
    const val = state.answers[q.id];
    if (q.required && q.type !== 'composite') {
      const empty = (val === undefined || val === null || val === '' || (Array.isArray(val) && val.length === 0));
      if (empty) {
        errors.push(`Required: "${q.label}".`);
        return errors;
      }
    }
    if (q.type === 'composite' && q.children) {
      for (const c of q.children) {
        if (c.required && !state.answers[c.id]) {
          errors.push(`Required: "${q.label}".`);
          return errors;
        }
      }
    }
  }
  return errors;
}

async function submit() {
  const btn = $('#nextBtn');
  btn.disabled = true;
  btn.textContent = "Submitting...";
  try {
    const payload = {
      _subject: `AI LEX 2026 — ${state.answers.company || 'Unknown'} — ${state.answers.name || 'Unknown'}`,
      submittedAt: new Date().toISOString(),
      questionnaireVersion: "v2",
      answers: state.answers
    };
    const res = await fetch(CONFIG.SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${t.slice(0, 200)}`);
    }
    state.step = state.visibleSections.length + 1;
    clearState();
    render();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Submit answers →";
    $('#errorMsg').textContent = `Submission failed. ${err.message}. Your answers are saved locally — you can retry.`;
  }
}

function renderConfirmation() {
  return `
    <div class="container">
      <div class="confirmation">
        <div class="checkmark">✓</div>
        <h2>Thank you</h2>
        <p>Your answers will shape the breakouts on June 18 and feed the portfolio benchmark presented that evening.</p>
        <p>Anything to add later? Email <a href="mailto:${CONFIG.CONTACT_EMAIL}">${CONFIG.CONTACT_EMAIL}</a>.</p>
        <p style="margin-top: 28px;"><button class="btn btn-ghost" onclick="window.location.reload()">Submit another response</button></p>
      </div>
    </div>
  `;
}

function updateProgress() {
  const total = state.visibleSections.length || 1;
  const pct = state.step === 0 ? 0 : Math.min(100, Math.round((state.step - 1) / total * 100) + (state.step > total ? 100 : 0));
  document.getElementById('progressFill').style.width = (state.step > total ? 100 : pct) + '%';
}

/* ============================================================
 * UTILS
 * ============================================================ */
function escapeHTML(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
}
function escapeAttr(s) { return escapeHTML(s); }

/* ============================================================
 * BOOT
 * ============================================================ */
loadState();
state.visibleSections = computeVisibleSections();
render();
</script>
</body>
