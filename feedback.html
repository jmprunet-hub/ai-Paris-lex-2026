<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI LEX 2026: Post-event feedback for Cathay Capital B2B SaaS portfolio leaders. Fully anonymous.">
<title>AI LEX 2026: Your feedback</title>
<style>
  :root{
    --navy:#1A1E2C; --navy-2:#252B3D; --navy-3:#303852;
    --amber:#FFB20A; --amber-dark:#E89C00; --amber-soft:rgba(255,178,10,0.12);
    --bg:#F4F5F7; --card:#FFFFFF; --input:#F7F8FA;
    --border:#E3E6EB; --border-strong:#C9CED6;
    --text:#1A1E2C; --muted:#5C6573; --dim:#9AA1AC;
    --error:#D64545; --success:#1E9E5A;
    --radius:12px; --shadow:0 1px 2px rgba(26,30,44,0.06),0 6px 20px rgba(26,30,44,0.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:var(--amber-dark);text-decoration:none;} a:hover{text-decoration:underline;}
  .header{border-bottom:1px solid var(--border);padding:14px 24px;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;}
  .header-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:24px;display:block;}
  .brand .brand-divider{width:1px;height:22px;background:var(--border-strong);}
  .brand .brand-event{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:var(--navy);background:var(--amber-soft);border:1px solid rgba(255,178,10,0.45);padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .container{max-width:760px;margin:0 auto;padding:28px 22px 120px;}
  .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);border-radius:16px;padding:38px 40px 34px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:20px;}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(255,178,10,0.14);}
  .hero img.hero-logo{height:28px;margin-bottom:22px;display:block;}
  .hero h1{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-0.01em;margin-bottom:10px;}
  .hero h1 .accent{color:var(--amber);}
  .hero .lede{color:rgba(255,255,255,0.9);font-size:15px;max-width:560px;position:relative;z-index:1;}
  .anon-pill{display:inline-block;margin-top:16px;background:var(--amber);color:var(--navy);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;}
  .section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .section-step{color:var(--amber-dark);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;}
  .section-title{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin-top:4px;color:var(--navy);}
  .question{margin-bottom:20px;padding-top:18px;border-top:1px solid var(--border);}
  .question:first-of-type{padding-top:4px;border-top:0;}
  .q-label{display:block;font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:8px;}
  .q-help{font-size:13px;color:var(--muted);margin:-2px 0 10px;}
  textarea,input[type="text"]{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;transition:border-color .15s,background .15s,box-shadow .15s;}
  textarea:focus,input[type="text"]:focus{outline:0;border-color:var(--amber);background:#fff;box-shadow:0 0 0 3px var(--amber-soft);}
  textarea{resize:vertical;min-height:64px;}
  .choice-group{display:flex;flex-direction:column;gap:8px;}
  .choice{display:flex;align-items:flex-start;gap:10px;background:var(--input);border:1px solid var(--border);padding:10px 14px;border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px;}
  .choice:hover{border-color:var(--border-strong);background:#fff;}
  .choice input{margin-top:3px;accent-color:var(--amber-dark);cursor:pointer;flex-shrink:0;}
  .choice.selected{border-color:var(--amber);background:var(--amber-soft);}
  .scale{display:flex;gap:8px;flex-wrap:wrap;}
  .scale button{flex:1;min-width:42px;padding:11px 0;border:1px solid var(--border);background:var(--input);border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px;transition:all .15s;font-family:inherit;}
  .scale button:hover{border-color:var(--border-strong);background:#fff;}
  .scale button.selected{border-color:var(--amber);background:var(--amber-soft);color:var(--amber-dark);}
  .scale.nps button{min-width:34px;padding:9px 0;font-size:14px;}
  .scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px;}
  .other-input{margin-top:8px;display:none;}
  .other-input.show{display:block;}
  .footer-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.97);border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(26,30,44,0.06);z-index:40;}
  .footer-inner{max-width:760px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .footer-note{font-size:12.5px;color:var(--dim);}
  .btn{border:0;border-radius:10px;font-weight:700;font-size:15px;padding:12px 26px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn-primary{background:var(--amber);color:var(--navy);}
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
  #errorMsg{color:var(--error);font-size:13px;margin-top:8px;}
  .thanks{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:44px 40px;box-shadow:var(--shadow);text-align:center;}
  .thanks .check{width:54px;height:54px;border-radius:50%;background:var(--amber-soft);border:2px solid var(--amber);color:var(--amber-dark);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;}
  .thanks h2{font-size:24px;color:var(--navy);margin-bottom:10px;}
  .thanks p{color:var(--muted);max-width:460px;margin:0 auto 8px;}
  @media(max-width:560px){.hero{padding:30px 24px 28px;}.section{padding:22px 20px;}.footer-note{display:none;}}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div class="brand">
  <img id="hdrLogo" alt="Cathay Capital">
  <span class="brand-divider"></span>
  <span class="brand-event">AI LEX 2026</span>
</div></div></div>

<main id="main" class="container"></main>

<div class="footer-bar" id="footerBar"><div class="footer-inner">
  <span class="footer-note">Fully anonymous. No name is collected.</span>
  <button class="btn btn-primary" id="submitBtn">Send feedback</button>
</div></div>

const SCHEMA = [
 { step:"Section 1 of 5", title:"Overall", questions:[
   { id:"q1_overall", type:"scale", min:1, max:5, label:"Overall, how was the evening?", ends:["Poor","Excellent"] },
   { id:"q2_nps", type:"scale", min:0, max:10, label:"How likely are you to recommend this format to a peer?", ends:["Not at all","Extremely"] },
   { id:"q3_useful", type:"text", label:"In one line: the single most useful thing you took away tonight." },
 ]},
 { step:"Section 2 of 5", title:"What worked", questions:[
   { id:"q4_valuable", type:"multi", label:"Which parts were most valuable to you?", options:[
     "Patrick Marous keynote (Thyssenkrupp)","Johannes Kliesch keynote (SNOCKS)","The portfolio survey read-out","Powell's talk (from individual use to organizational capability)","BOT presentation","Your breakout table","The networking / cocktail"] },
   { id:"q5_rebalance", type:"text", label:"If you could rebalance the evening: more of what, less of what?" },
 ]},
 { step:"Section 3 of 5", title:"Your breakout", questions:[
   { id:"q6_breakout_value", type:"scale", min:1, max:5, label:"How valuable was your breakout table?", ends:["Not valuable","Very valuable"] },
   { id:"q7_followup", type:"single", label:"Did your table spark a concrete follow-up (a contact to ping, an idea to test)?", options:["Yes","Not yet"] },
 ]},
 { step:"Section 4 of 5", title:"Next time", questions:[
   { id:"q8_change", type:"text", label:"What would you change or add for a future edition?" },
   { id:"q9_cadence", type:"single", label:"Ideal cadence:", options:["Twice a year","Once a year","Quarterly touchpoints between events","Other"], other:true },
   { id:"q10_topics", type:"multi", label:"Topics you'd want next time:", options:[
     "AI pricing & business models","Agentic product & the FDE shift","Governance & EU AI Act","GTM & product marketing","Talent & change management","Cost, sovereignty & make-vs-buy","Measuring AI ROI","Other"], other:true },
 ]},
 { step:"Section 5 of 5", title:"More value from Cathay", questions:[
   { id:"q11_cathay_value", type:"multi", label:"Beyond events, where can Cathay help you most on AI?", options:[
     "Warm peer introductions","Shared playbooks & templates","An anonymised portfolio benchmark (dashboard)","Access to experts & operating partners","Vendor / tool introductions","Cross-portfolio co-sell","Talent & hiring","The WhatsApp communities","Other"], other:true },
 ]},
];

const answers = {};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function renderQuestion(q){
  const wrap = el(`<div class="question"></div>`);
  wrap.appendChild(el(`<div class="q-label">${q.label}</div>`));

  if(q.type==="text"){
    const ta = el(`<textarea data-id="${q.id}" placeholder="Optional, but very welcome."></textarea>`);
    ta.addEventListener('input', e=>{ answers[q.id]=e.target.value.trim()||undefined; });
    wrap.appendChild(ta);
  }
  else if(q.type==="scale"){
    const grp = el(`<div class="scale ${q.max>5?'nps':''}"></div>`);
    for(let v=q.min; v<=q.max; v++){
      const b = el(`<button type="button" data-v="${v}">${v}</button>`);
      b.addEventListener('click', ()=>{ answers[q.id]=v; grp.querySelectorAll('button').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); });
      grp.appendChild(b);
    }
    wrap.appendChild(grp);
    if(q.ends) wrap.appendChild(el(`<div class="scale-ends"><span>${q.ends[0]}</span><span>${q.ends[1]}</span></div>`));
  }
  else if(q.type==="single" || q.type==="multi"){
    const grp = el(`<div class="choice-group"></div>`);
    const inputType = q.type==="single" ? "radio" : "checkbox";
    q.options.forEach(opt=>{
      const lab = el(`<label class="choice"><input type="${inputType}" name="${q.id}" value="${opt}"><span class="choice-text">${opt}</span></label>`);
      const input = lab.querySelector('input');
      input.addEventListener('change', ()=>{
        if(q.type==="single"){
          answers[q.id]=opt;
          grp.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
          lab.classList.add('selected');
        } else {
          const arr = Array.isArray(answers[q.id])?answers[q.id]:[];
          if(input.checked){ arr.push(opt); lab.classList.add('selected'); }
          else { const i=arr.indexOf(opt); if(i>=0)arr.splice(i,1); lab.classList.remove('selected'); }
          answers[q.id]=arr.length?arr:undefined;
        }
        if(q.other){
          const oi = grp.parentNode.querySelector('.other-input');
          const isOther = q.type==="single" ? (opt==="Other") : grp.querySelector('input[value="Other"]').checked;
          oi.classList.toggle('show', !!isOther);
        }
      });
      grp.appendChild(lab);
    });
    wrap.appendChild(grp);
    if(q.other){
      const oi = el(`<div class="other-input"><input type="text" placeholder="Other, please specify"></div>`);
      oi.querySelector('input').addEventListener('input', e=>{ answers[q.id+"_other"]=e.target.value.trim()||undefined; });
      wrap.appendChild(oi);
    }
  }
  return wrap;
}

function render(){
  const main = document.getElementById('main');
  main.innerHTML="";
  const hero = el(`<div class="hero">
    <img class="hero-logo" src="${LOGO_WHITE}" alt="Cathay Capital">
    <h1>Your feedback on <span class="accent">AI LEX 2026</span></h1>
    <p class="lede">Three minutes to help us make the next one better, and to tell us where Cathay can bring you more value on AI.</p>
    <span class="anon-pill">Fully anonymous. We don't collect your name.</span>
  </div>`);
  main.appendChild(hero);
  SCHEMA.forEach(sec=>{
    const card = el(`<div class="section"></div>`);
    card.appendChild(el(`<div class="section-step">${sec.step}</div>`));
    card.appendChild(el(`<div class="section-title">${sec.title}</div>`));
    sec.questions.forEach(q=> card.appendChild(renderQuestion(q)));
    main.appendChild(card);
  });
  main.appendChild(el(`<div id="errorMsg"></div>`));
}

async function submit(){
  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent="Sending...";
  document.getElementById('errorMsg').textContent="";
  const payload = { _subject:"AI LEX 2026: Feedback (anonymous)", questionnaireVersion:CONFIG.VERSION, answers:answers };
  try{
    const res = await fetch(CONFIG.SUBMIT_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(payload) });
    if(!res.ok) throw new Error("HTTP "+res.status);
    document.getElementById('footerBar').style.display="none";
    document.getElementById('main').innerHTML = `
      <div class="thanks">
        <div class="check">&#10003;</div>
        <h2>Thank you.</h2>
        <p>Your feedback is in, fully anonymous.</p>
        <p>The take-aways from each breakout, the speakers' decks and the next steps will reach you shortly, and the conversation continues in the <strong>Cathay SaaS Communities</strong> WhatsApp groups.</p>
      </div>`;
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    btn.disabled=false; btn.textContent="Send feedback";
    document.getElementById('errorMsg').textContent = "Sending failed ("+err.message+"). Please try again in a moment.";
  }
}

render();
document.getElementById('submitBtn').addEventListener('click', submit);
</script>
